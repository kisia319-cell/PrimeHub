name: Build and publish PrimeHub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all tkinter --name PrimeHub primehub.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: PrimeHub v1.1.1
          target_commitish: main
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/PrimeHub.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
