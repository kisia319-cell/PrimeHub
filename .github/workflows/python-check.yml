name: PrimeHub checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/primehub-account-apocalypse]

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile PrimeHub
        run: python -m py_compile primehub.py
      - name: Check auth and Apocalypse entry points
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("primehub.py").read_text(encoding="utf-8")
          required = (
              "def submit_register(self):",
              "def submit_verify(self):",
              "def submit_login(self):",
              "def check_updates(self):",
              "selected_platform = self.platform",
              'if selected_platform == "PC":',
              'elif selected_platform == "Android":',
              "self.fetch_latest_apocalypse_release()",
              "self.fetch_latest_mobile_release",
              "update-check.log",
              "API_PRIME_MOBILE = \"https://api.github.com/repos/kisia319-cell/SkyRealm-Hub-Mobile/releases/latest\"",
              "def launch_apocalypse(self):",
              "def show_settings(self):",
              "def show_apocalypse_settings(self):",
              "def save_apocalypse_settings(self, settings=None):",
              "def close_hub_after_launch(self):",
              "APOCALYPSE_CONFIG",
              "survivalDifficulty",
              "renderDistance",
              "showEnemyHealth",
              "showSurvivalHud",
              "apocalypse-pc-v1.5.5",
              "check_updates_on_start",
              "check_skyrealm_channel",
              "check_apocalypse_channel",
              "check_android_channel",
              "check_primehub_channel",
              "network_retries",
              "network_timeout_seconds",
              "keep_backups",
              "clear_cache_after_install",
              "remember_window_size",
              "def _read_response(self, request, timeout=None):",
              "def _record_channel_status(self, key, ok, message, version=\"\"):",
              "def _render_channels(self):",
              "def restore_apocalypse_backup(self):",
              "def download_asset(self, asset, target):",
              "X-RateLimit-Remaining",
              "API_SKY = \"https://api.github.com/repos/kisia319-cell/SkyRealm-PC-Launcher/releases/latest\"",
              "confirm_updates",
              "close_hub_after_launch",
              "SKYREALM_APOCALYPSE_SETTINGS_JSON",
              'headers["Authorization"] = "Bearer "',
              '"apikey": API_KEY',
          )
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Missing PrimeHub integration: " + ", ".join(missing))
          import ast, re
          tree = ast.parse(source)
          version_fn = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "_version_key")
          namespace = {"re": re}
          exec(compile(ast.Module(body=[version_fn], type_ignores=[]), "version-check", "exec"), namespace)
          version_key = namespace["_version_key"]
          if not version_key("v1.2.10") > version_key("v1.2.9"):
              raise SystemExit("PrimeHub version ordering regression")
          if 'pack(before=' in source:
              raise SystemExit("Unsafe Tkinter pack(before=...) layout call found")
          print("PrimeHub account, update channels, diagnostics, rollback and version-order checks passed.")
          PY
