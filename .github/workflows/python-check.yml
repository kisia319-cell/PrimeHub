name: PrimeHub checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/primehub-account-apocalypse]

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile PrimeHub
        run: python -m py_compile primehub.py
      - name: Check auth and Apocalypse entry points
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("primehub.py").read_text(encoding="utf-8")
          required = (
              "def submit_register(self):",
              "def submit_verify(self):",
              "def submit_login(self):",
              "def check_updates(self):",
              "selected_platform = self.platform",
              'if selected_platform == "PC":',
              'elif selected_platform == "Android":',
              "self.fetch_latest_apocalypse_release()",
              "self.fetch_latest_mobile_release()",
              "update-check.log",
              "API_PRIME_MOBILE = \"https://api.github.com/repos/kisia319-cell/SkyRealm-Hub-Mobile/releases/latest\"",
              "def launch_apocalypse(self):",
              "def show_settings(self):",
              "def show_apocalypse_settings(self):",
              "def save_apocalypse_settings(self, settings=None):",
              "def close_hub_after_launch(self):",
              "APOCALYPSE_CONFIG",
              "survivalDifficulty",
              "renderDistance",
              "showEnemyHealth",
              "showSurvivalHud",
              "apocalypse-pc-v1.4.3",
              "check_updates_on_start",
              "confirm_updates",
              "close_hub_after_launch",
              "SKYREALM_APOCALYPSE_SETTINGS_JSON",
              'headers["Authorization"] = "Bearer "',
              '"apikey": API_KEY',
          )
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Missing PrimeHub integration: " + ", ".join(missing))
          print("PrimeHub account and Apocalypse integration checks passed.")
          PY
